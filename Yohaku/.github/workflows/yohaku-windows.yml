name: Build Yohaku Windows onedir

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Yohaku/**'
      - '.github/workflows/yohaku-windows.yml'
      - 'downloads/Yohaku/*onedir-build.zip'
      - 'downloads/Yohaku/Yohaku.spec'

permissions:
  contents: read

concurrency:
  group: yohaku-windows-${{ github.ref }}-bounded
  cancel-in-progress: true

jobs:
  windows-onedir:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find Yohaku source
        shell: pwsh
        run: |
          $project = if (Test-Path "$env:GITHUB_WORKSPACE\Yohaku\MANIFEST_SHA256.json") { "$env:GITHUB_WORKSPACE\Yohaku" } else { "$env:GITHUB_WORKSPACE" }
          "YOHAKU_PROJECT=$project" >> $env:GITHUB_ENV
      - name: Verify merged source
        working-directory: ${{ env.YOHAKU_PROJECT }}
        env:
          PYTHONUTF8: '1'
        run: python scripts/check_source.py
      - name: Install build dependencies
        working-directory: ${{ env.YOHAKU_PROJECT }}
        run: python -m pip install -r requirements-build.txt
      - name: Check growth, portable storage and character actions with a timeout
        working-directory: ${{ env.YOHAKU_PROJECT }}
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
          LOCALAPPDATA: ${{ runner.temp }}/Yohaku-shelf-tests
        run: python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(['tests.test_growth_records', 'tests.test_system_dialogue', 'tests.test_dialogue_json', 'tests.test_dialogue_editor', 'tests.test_departure', 'tests.test_level_up_animation', 'tests.test_exp_popup', 'tests.test_growth', 'tests.test_growth_content', 'tests.test_growth_ui', 'tests.test_storage', 'tests.test_shelf', 'tests.test_file_drop_ui', 'tests.test_walk_animation', 'tests.test_motion', 'tests.test_ui.UserInterfaceTests.test_pickup_pose_renders_for_all_characters_and_restores_on_release', 'tests.test_ui.UserInterfaceTests.test_hiding_during_pickup_clears_the_pose_and_does_not_leave_a_stuck_press', 'tests.test_ui.UserInterfaceTests.test_reminder_input_keeps_note_pose_and_leaving_the_form_clears_it', 'tests.test_ui.UserInterfaceTests.test_note_frames_animate_and_static_mode_keeps_the_notepad_for_every_character'])); faulthandler.cancel_dump_traceback_later(); raise SystemExit(not result.wasSuccessful())"
      - name: Run synthetic-data tests
        working-directory: ${{ env.YOHAKU_PROJECT }}
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          LOCALAPPDATA: ${{ runner.temp }}/Yohaku-tests
        run: python -X faulthandler -c "import faulthandler, unittest; faulthandler.dump_traceback_later(360, exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); faulthandler.cancel_dump_traceback_later(); raise SystemExit(not result.wasSuccessful())"
      - name: Build Windows onedir ZIP
        working-directory: ${{ env.YOHAKU_PROJECT }}
        run: python scripts/build_onedir.py --skip-install
      - name: Check packaged EXE without user data or Outlook
        working-directory: ${{ env.YOHAKU_PROJECT }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          LOCALAPPDATA: ${{ runner.temp }}/Yohaku-bundle
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'Yohaku-bundle-smoke.json'
          $app = Start-Process -FilePath '.\dist\Yohaku\Yohaku.exe' -ArgumentList @('--self-check', ('"{0}"' -f $report)) -PassThru
          if (-not $app.WaitForExit(60000)) { Stop-Process -Id $app.Id -Force; throw 'Bundle check timed out after 60 seconds.' }
          if ($app.ExitCode -ne 0) { throw "Bundle check exited with $($app.ExitCode)." }
          $result = Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json
          $expected = python -c "from companion.metadata import VERSION; print(VERSION)"
          if (-not $result.success -or $result.version -ne $expected) { throw 'Bundle report failed or version mismatched.' }
          if (Test-Path '.\dist\Yohaku\Data') { throw 'Self-check must not create portable user data.' }
          $result | ConvertTo-Json
          if (-not $result.growth_restore_checked -or -not $result.content_editor_checked -or -not $result.costume_layers_checked) { throw 'Growth/editor bundle checks did not complete.' }
          if (-not $result.growth_records_checked) { throw 'Growth records and wardrobe trial check did not complete.' }
          if (-not $result.system_dialogue_checked) { throw 'System dialogue check did not complete.' }
          if (-not $result.level_up_animation_checked) { throw 'Level-up animation check did not complete.' }
          if (-not $result.floating_exp_checked -or -not $result.editor_preview_checked) { throw 'Floating EXP or animated editor checks did not complete.' }
          if (-not (Test-Path '.\dist\Yohaku\YohakuContentEditor.exe')) { throw 'Independent editor EXE is missing.' }
          $editorContent = Join-Path $env:RUNNER_TEMP 'Yohaku-independent-editor-content'
          $editor = Start-Process -FilePath '.\dist\Yohaku\YohakuContentEditor.exe' -ArgumentList @('--content-root', ('"{0}"' -f $editorContent)) -PassThru
          try {
            $editorPack = Join-Path $editorContent 'base/pack.json'
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path $editorPack)) {
              if ($editor.HasExited -or (Get-Date) -gt $deadline) { throw 'Independent editor did not start.' }
              Start-Sleep -Milliseconds 200
            }
            if ($editor.HasExited) { throw 'Independent editor exited during startup.' }
            Write-Output 'Independent editor EXE created its sample content in the isolated folder.'
          } finally {
            if (-not $editor.HasExited) { Stop-Process -Id $editor.Id -Force }
            $editor.WaitForExit(5000) | Out-Null
          }
          $normal = Start-Process -FilePath '.\dist\Yohaku\Yohaku.exe' -PassThru
          try {
            $settings = Join-Path (Get-Location) 'dist/Yohaku/Data/settings.json'
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path $settings)) {
              if ($normal.HasExited -or (Get-Date) -gt $deadline) { throw 'Normal EXE startup did not create adjacent Data/settings.json.' }
              Start-Sleep -Milliseconds 200
            }
            $saved = Get-Content -Raw -Encoding UTF8 $settings | ConvertFrom-Json
            if ($saved.outlook_enabled -or $saved.file_logging) { throw 'Fresh data must keep Outlook and file logging off.' }
            if (Test-Path '.\dist\Yohaku\_internal\Data') { throw 'Portable data must not be inside _internal.' }
            if (Test-Path (Join-Path $env:LOCALAPPDATA 'Yohaku')) { throw 'New startup must not create the old user-data folder.' }
            Write-Output 'Normal frozen EXE created adjacent Data/settings.json without old-folder writes.'
          } finally {
            if (-not $normal.HasExited) { Stop-Process -Id $normal.Id -Force }
            $normal.WaitForExit(5000) | Out-Null
          }
      - name: Build the downloadable kit without tests
        if: ${{ hashFiles('downloads/Yohaku/*onedir-build.zip') != '' }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
          LOCALAPPDATA: ${{ runner.temp }}/Yohaku-kit-check
        run: |
          $version = python -c "import sys; sys.path.insert(0, r'$env:YOHAKU_PROJECT'); from companion.metadata import VERSION; print(VERSION)"
          $kitArchive = Join-Path $env:GITHUB_WORKSPACE "downloads/Yohaku/Yohaku-v$version-onedir-build.zip"
          $destination = Join-Path $env:RUNNER_TEMP 'Yohaku-download-kit'
          Expand-Archive -LiteralPath $kitArchive -DestinationPath $destination
          $kit = Join-Path $destination 'Yohaku'
          if (Test-Path (Join-Path $kit 'tests')) { throw 'The build kit must not require or include tests.' }
          $standalone = Join-Path $env:GITHUB_WORKSPACE 'downloads/Yohaku/Yohaku.spec'
          if ((Get-FileHash $standalone).Hash -ne (Get-FileHash (Join-Path $kit 'Yohaku.spec')).Hash) { throw 'Standalone spec differs from kit.' }
          Push-Location $kit
          try {
            python scripts/check_source.py
            if ($LASTEXITCODE -ne 0) { throw 'Kit integrity check failed.' }
            python -m PyInstaller --noconfirm --clean Yohaku.spec
            if ($LASTEXITCODE -ne 0) { throw 'Kit onedir build failed.' }
            python scripts/collect_licenses.py dist/Yohaku
            if ($LASTEXITCODE -ne 0) { throw 'Kit license collection failed.' }
            $report = Join-Path $env:RUNNER_TEMP 'Yohaku-kit-smoke.json'
            $app = Start-Process -FilePath '.\dist\Yohaku\Yohaku.exe' -ArgumentList @('--self-check', ('"{0}"' -f $report)) -PassThru
            if (-not $app.WaitForExit(60000)) { Stop-Process -Id $app.Id -Force; throw 'Kit smoke timed out.' }
            if ($app.ExitCode -ne 0) { throw 'Kit EXE check failed.' }
            $result = Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json
            if (-not $result.success -or $result.version -ne $version) { throw 'Kit smoke report failed.' }
            if (Test-Path '.\dist\Yohaku\Data') { throw 'Kit self-check must not create portable user data.' }
            $result | ConvertTo-Json
          } finally { Pop-Location }
      - name: Package source ZIP
        working-directory: ${{ env.YOHAKU_PROJECT }}
        run: python scripts/package_source.py
      - name: Upload ZIPs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Yohaku-Windows-onedir-and-source
          path: |
            ${{ env.YOHAKU_PROJECT }}/release/*
            ${{ runner.temp }}/Yohaku-bundle-smoke.json
            ${{ runner.temp }}/Yohaku-kit-smoke.json
          if-no-files-found: error
          retention-days: 30
