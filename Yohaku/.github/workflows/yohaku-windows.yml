name: Build YOHAKU Windows onedir

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-onedir:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Find YOHAKU source
        shell: pwsh
        run: |
          $project = if (Test-Path "$env:GITHUB_WORKSPACE\Yohaku\Yohaku.spec") { "$env:GITHUB_WORKSPACE\Yohaku" } else { "$env:GITHUB_WORKSPACE" }
          if (-not (Test-Path "$project\Yohaku.spec")) { throw "Yohaku.spec was not found." }
          "YOHAKU_PROJECT=$project" >> $env:GITHUB_ENV
      - name: Install build dependencies
        working-directory: ${{ env.YOHAKU_PROJECT }}
        run: python -m pip install -r requirements-build.txt
      - name: Run synthetic-data tests
        working-directory: ${{ env.YOHAKU_PROJECT }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Windows onedir ZIP
        working-directory: ${{ env.YOHAKU_PROJECT }}
        run: python scripts/build_onedir.py --skip-install
      - name: Package two source ZIPs
        working-directory: ${{ env.YOHAKU_PROJECT }}
        run: python scripts/package_source.py
      - name: Upload ZIPs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Yohaku-Windows-onedir-and-source
          path: ${{ env.YOHAKU_PROJECT }}/release/*
          if-no-files-found: error
          retention-days: 30
