name: Build Windows application

on:
  push:
    branches: [main]
    paths: ['build-windows.bat', '*.py', 'tests/**', 'assets/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folderadjuster-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        timeout-minutes: 3
        run: |
          python -c "import faulthandler,unittest; faulthandler.dump_traceback_later(90,exit=True); result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')); faulthandler.cancel_dump_traceback_later(); raise SystemExit(not result.wasSuccessful())" 2>&1 | Tee-Object WindowsTests.log
          exit $LASTEXITCODE
      - name: Publish failed test diagnostics
        if: failure()
        shell: pwsh
        run: |
          git checkout --orphan windows-diagnostics-${{ github.sha }}
          git rm -r --cached .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WindowsTests.log
          git commit -m 'Record Windows test failure diagnostics'
          git push origin HEAD:refs/heads/windows-diagnostics-${{ github.sha }}
      - name: Install build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name FolderAdjuster --icon assets/FolderAdjuster.ico --add-data "assets;assets" app.py
      - name: Package onedir executable
        shell: pwsh
        run: |
          Copy-Item README.md dist/FolderAdjuster/README.md
          Copy-Item AUDIT.md dist/FolderAdjuster/AUDIT.md
          if (-not (Test-Path dist/FolderAdjuster/_internal/python312.dll)) { throw 'Runtime DLL missing' }
          if (-not (Test-Path dist/FolderAdjuster/_internal/assets/FolderAdjuster.ico)) { throw 'Bundled icon missing' }
          Compress-Archive -Path dist/FolderAdjuster -DestinationPath FolderAdjuster-Windows.zip
      - name: Check extracted onedir application starts
        timeout-minutes: 2
        shell: pwsh
        run: |
          $extracted = Join-Path $env:RUNNER_TEMP 'FolderAdjuster 展開テスト'
          Expand-Archive FolderAdjuster-Windows.zip -DestinationPath $extracted
          $appFolder = Join-Path $extracted 'FolderAdjuster'
          $exe = Join-Path $appFolder 'FolderAdjuster.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Application startup failed' }
          if (-not (Test-Path (Join-Path $appFolder 'FolderAdjuster.smoke-test.txt'))) { throw 'Startup confirmation missing' }
          if (Test-Path (Join-Path $appFolder '_internal/settings.json')) { throw 'Settings were stored in bundled runtime' }
      - uses: actions/upload-artifact@v4
        with:
          name: FolderAdjuster-Windows
          path: FolderAdjuster-Windows.zip
          if-no-files-found: error
      - name: Publish GitHub download branch
        shell: pwsh
        run: |
          git checkout --orphan windows-build-${{ github.sha }}
          git rm -r --cached .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FolderAdjuster-Windows.zip
          git commit -m 'Add tested Windows executable package'
          git push origin HEAD:refs/heads/windows-build-${{ github.sha }}
